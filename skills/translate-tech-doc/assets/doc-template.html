<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script>
  // 깜빡임 방지: 렌더 전에 테마 적용 (localStorage → OS → light)
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  /* Theme Variables */
  :root {
    --bg: #ffffff; --surface: #f6f8fa; --text: #24292f; --text-muted: #57606a;
    --border: #d0d7de; --accent: #0969da; --code-bg: #f6f8fa; --hover: #eaeef2;
  }
  [data-theme="dark"] {
    --bg: #0d1117; --surface: #161b22; --text: #e6edf3; --text-muted: #8b949e;
    --border: #30363d; --accent: #58a6ff; --code-bg: #161b22; --hover: #21262d;
  }

  /* Typography */
  * { box-sizing: border-box; }
  html { scroll-padding-top: 72px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px; line-height: 1.75; font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4, h5, h6 { font-weight: 600; line-height: 1.4; margin: 2em 0 .75em; }
  h1 { font-size: 2em; margin-top: 0; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  h3 { font-size: 1.25em; }
  h4 { font-size: 1.05em; }
  h5, h6 { font-size: 1em; color: var(--text-muted); }
  p, ul, ol, blockquote, table, pre, details { margin: 0 0 1em; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  img { max-width: 100%; height: auto; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  blockquote { margin-left: 0; padding: 0 1em; color: var(--text-muted); border-left: 4px solid var(--border); }
  li + li { margin-top: .25em; }
  ul.contains-task-list { list-style: none; padding-left: 1.2em; }
  .footnotes { font-size: .9em; color: var(--text-muted); }

  /* Layout */
  .site-header {
    position: sticky; top: 0; z-index: 10; height: 56px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 0 24px; background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .document-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button {
    font: inherit; font-size: 13px; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button:hover { background: var(--hover); }
  .layout { display: flex; max-width: 1240px; margin: 0 auto; }
  .content { flex: 1; min-width: 0; max-width: 960px; padding: 32px 40px 80px; }
  .doc-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
  .doc-meta span + span::before { content: " · "; }

  /* Sidebar */
  .toc { width: 260px; flex-shrink: 0; }
  .toc details { position: sticky; top: 56px; max-height: calc(100vh - 56px); overflow-y: auto; padding: 24px 16px; margin: 0; }
  .toc summary { font-weight: 600; font-size: 13px; color: var(--text-muted); cursor: pointer; margin-bottom: 8px; }
  .toc ul { list-style: none; margin: 0; padding: 0; font-size: 13px; line-height: 1.5; }
  .toc li { margin: 0; }
  .toc a { display: block; padding: 4px 8px; color: var(--text-muted); border-left: 2px solid transparent; }
  .toc a:hover { color: var(--text); background: var(--hover); text-decoration: none; }
  .toc a.active { color: var(--accent); border-left-color: var(--accent); }
  .toc .lvl-3 a { padding-left: 20px; }

  /* Tables */
  .table-wrap { overflow-x: auto; margin-bottom: 1em; }
  table { border-collapse: collapse; margin: 0; }
  th, td { border: 1px solid var(--border); padding: 6px 13px; text-align: left; vertical-align: top; }
  th { background: var(--surface); font-weight: 600; }

  /* Code Blocks */
  pre, code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 13px; }
  :not(pre) > code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: .1em .35em; }
  .code-wrap { position: relative; }
  pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; overflow-x: auto; line-height: 1.5; }
  .copy-btn { position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 2px 8px; opacity: .8; }
  .copy-btn:hover { opacity: 1; }

  /* Responsive */
  @media (max-width: 768px) {
    .site-header { padding: 0 16px; }
    .layout { display: block; }
    .toc { width: auto; border-bottom: 1px solid var(--border); }
    .toc details { position: static; max-height: none; padding: 12px 16px; }
    .content { padding: 24px 16px 64px; }
  }

  /* Print */
  @media print {
    :root, [data-theme="dark"] { --bg: #fff; --surface: #f6f8fa; --text: #000; --text-muted: #444; --border: #ccc; --accent: #0550ae; --code-bg: #f6f8fa; }
    .site-header { position: static; }
    #theme-toggle, .toc, .copy-btn { display: none !important; }
    .content { max-width: none; padding: 0; }
    pre { white-space: pre-wrap; word-break: break-word; }
    pre, table, blockquote, img { page-break-inside: avoid; }
    h1, h2, h3, h4 { page-break-after: avoid; }
    a[href^="http"]::after { content: " (" attr(href) ")"; font-size: .85em; color: var(--text-muted); }
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="document-title">{{TITLE}}</div>
    <button id="theme-toggle" type="button" aria-label="테마 변경">테마 변경</button>
  </header>
  <div class="layout">
    <aside class="toc">
      <details open><summary>목차</summary><nav><ul></ul></nav></details>
    </aside>
    <main class="content">
      <div class="doc-meta">
        <span>원본: {{SOURCE_FILE}}</span><span>언어: 한국어</span><span>번역일: {{DATE}}</span>
      </div>
      <article>
<!-- {{CONTENT}} -->
      </article>
    </main>
  </div>
<script>
(function () {
  var root = document.documentElement;
  var article = document.querySelector('article');

  // Theme Toggle
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  // Heading Anchor: id 없는 제목에 id 부여, 중복 제거
  var used = {};
  article.querySelectorAll('[id]').forEach(function (el) { used[el.id] = true; });
  var headings = article.querySelectorAll('h1, h2, h3, h4, h5, h6');
  headings.forEach(function (h) {
    if (h.id) return;
    var base = h.textContent.trim().toLowerCase()
      .replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s+/g, '-') || 'section';
    var id = base, n = 1;
    while (used[id]) id = base + '-' + n++;
    used[id] = true;
    h.id = id;
  });

  // TOC Navigation (H2, H3)
  var list = document.querySelector('.toc ul');
  var links = {};
  var tocHeadings = article.querySelectorAll('h2, h3');
  tocHeadings.forEach(function (h) {
    var li = document.createElement('li');
    li.className = 'lvl-' + h.tagName[1];
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    list.appendChild(li);
    links[h.id] = a;
  });
  if (!tocHeadings.length) document.querySelector('.toc').style.display = 'none';
  var details = document.querySelector('.toc details');
  if (matchMedia('(max-width: 768px)').matches) details.removeAttribute('open');
  list.addEventListener('click', function (e) {
    if (e.target.tagName === 'A' && matchMedia('(max-width: 768px)').matches) details.removeAttribute('open');
  });
  if ('IntersectionObserver' in window) {
    var current = null;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        if (current) current.classList.remove('active');
        current = links[en.target.id];
        if (current) current.classList.add('active');
      });
    }, { rootMargin: '-60px 0px -70% 0px' });
    tocHeadings.forEach(function (h) { io.observe(h); });
  }

  // Tables: 가로 스크롤 래퍼
  article.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div');
    w.className = 'table-wrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });

  // Code Copy
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok ? Promise.resolve() : Promise.reject();
  }
  article.querySelectorAll('pre').forEach(function (pre) {
    var wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.addEventListener('click', function () {
      var text = pre.innerText;
      var p = navigator.clipboard && window.isSecureContext
        ? navigator.clipboard.writeText(text).catch(function () { return fallbackCopy(text); })
        : fallbackCopy(text);
      p.then(function () { btn.textContent = 'Copied!'; }, function () { btn.textContent = '복사 실패'; })
       .then(function () { setTimeout(function () { btn.textContent = 'Copy'; }, 1500); });
    });
    wrap.appendChild(btn);
  });
})();
</script>
</body>
</html>
